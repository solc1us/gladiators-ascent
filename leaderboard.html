<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gladiator's Ascent | Leaderboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/script.js" defer></script>
</head>
<body class="flex min-h-screen flex-col overflow-x-hidden bg-stone-950 font-sans text-amber-50 antialiased">
    <header class="border-b border-amber-800 bg-stone-950/95 px-4 pt-8 text-center shadow-lg">
        <h1 class="font-serif text-3xl font-black tracking-wide text-amber-300 sm:text-5xl">Gladiator Leaderboard</h1>
        <nav class="mx-auto mt-7 max-w-6xl border-t border-amber-900" aria-label="Primary navigation">
            <ul class="flex flex-col gap-1 py-3 sm:flex-row sm:flex-wrap sm:justify-center">
                <li><a class="block min-h-11 rounded-md px-4 py-2.5 font-bold transition hover:bg-stone-800 hover:text-amber-300" href="index.html">Home</a></li><li><a class="block min-h-11 rounded-md px-4 py-2.5 font-bold transition hover:bg-stone-800 hover:text-amber-300" href="hub.html">Gladiator Hub</a></li><li><a class="block min-h-11 rounded-md px-4 py-2.5 font-bold transition hover:bg-stone-800 hover:text-amber-300" href="arena.html">Arena</a></li><li><a class="block min-h-11 rounded-md px-4 py-2.5 font-bold transition hover:bg-stone-800 hover:text-amber-300" href="shop.html">Shop</a></li><li><a class="block min-h-11 rounded-md bg-amber-600 px-4 py-2.5 font-bold text-stone-950" href="leaderboard.html" aria-current="page">Leaderboard</a></li><li><a class="block min-h-11 rounded-md px-4 py-2.5 font-bold transition hover:bg-stone-800 hover:text-amber-300" href="profile.html">Player Profile</a></li>
            </ul>
        </nav>
    </header>

    <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-8 sm:px-6 sm:py-12">
        <section class="rounded-xl border border-amber-900 bg-stone-900/90 p-4 shadow-xl sm:p-6" aria-labelledby="rankings-heading">
            <h2 class="mb-3 border-b border-amber-800 pb-3 font-serif text-2xl font-bold text-amber-300" id="rankings-heading">Rankings</h2>
            <p class="mb-5 max-w-3xl leading-7 text-stone-400">Dead gladiators remain permanently recorded on the leaderboard but can no longer earn kills.</p>
            <button class="mb-5 min-h-11 rounded-md border border-amber-600 bg-red-950 px-4 py-2 font-bold hover:bg-red-900" type="button" id="toggle-dead-button">Hide Dead Gladiators</button>
            <div class="max-w-full overflow-x-auto rounded-lg border border-amber-900" role="region" aria-label="Scrollable gladiator leaderboard" tabindex="0">
                <table class="w-full min-w-160 border-collapse text-sm sm:text-base" id="leaderboard-table">
                    <caption class="bg-stone-950 px-4 py-3 text-left text-sm italic text-stone-400">Current gladiator rankings</caption>
                    <thead class="bg-red-950 font-serif text-amber-50"><tr><th class="px-4 py-3 text-center" scope="col">Rank</th><th class="px-4 py-3 text-left" scope="col">Gladiator</th><th class="px-4 py-3 text-center" scope="col">Kills</th><th class="px-4 py-3 text-center" scope="col">Status</th></tr></thead>
                    <tbody class="divide-y divide-amber-900 bg-amber-50 text-stone-950" id="leaderboard-body"></tbody>
                </table>
            </div>
        </section>
    </main>
    <footer class="border-t border-amber-900 bg-stone-950 px-4 py-6 text-center font-serif text-sm text-stone-500"><p>Gladiator's Ascent</p></footer>
</body>
</html>
